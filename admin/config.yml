        label: Photographers
        widget: list
        label_singular: Photographer
        summary: '{{fields.name}}{{#if fields.active}}{{else}} (hidden){{/if}}'
        fields:
        - name: name
          label: Name
          widget: string
        - name: active
          label: Show on the site
          widget: boolean
          default: false
          hint: Leave off until the profile is approved.
        - name: temp
          label: Placeholder profile
          widget: boolean
          default: false
          hint: On keeps the profile private whatever else is set. A profile goes public only when it is active, not a placeholder, and has both a headshot and a provider ID.
        - name: specialties
          label: Specialties
          widget: string
        - name: bio
          label: Short bio
          widget: text
        - name: headshot
          label: Headshot
          widget: image
          required: false
        - name: portfolio
          label: Portfolio images
          widget: list
          required: false
          field:
            name: image
            label: Image
            widget: image
        - name: providerId
          label: SimplyBook provider ID
          widget: string
          required: false
          hint: Scopes “Book with …” to this photographer's own availability.
        - name: booking
          label: Booking key
          widget: string
          hint: Usually photographySessions.
      - name: firstAvailable
        label: First-available panel
        widget: object
        collapsed: true
        fields:
        - name: title
          label: Title
          widget: string
        - name: text
          label: Text
          widget: text
        - name: cta
          label: Button text
          widget: string
        - name: booking
          label: Booking key
          widget: string
      hint: Never publish a photographer’s personal phone, personal email, Instagram, personal website or their own pricing.
