- name: studio
  label: Studio & rooms
  files:
  - name: rooms
    label: The rooms
    file: data/studio.json
    fields:
    - name: studio
      label: Studio
      widget: object
      fields:
      - name: eyebrow
        label: Eyebrow
        widget: string
      - name: headline
        label: Headline
        widget: list
        field:
          name: line
          label: Line
          widget: string
      - name: body
        label: Copy
        widget: text
      - name: image
        label: Main studio photo
        widget: image
      - name: rooms
        label: Rooms
        widget: list
        label_singular: Room
        summary: '{{fields.name}} — {{fields.role}}'
        fields:
        - name: name
          label: Room name
          widget: string
        - name: role
          label: What it is for
          widget: string
          hint: Short line above the name, e.g. Podcast + Interview Studio
        - name: image
          label: Room photo
          widget: image
          hint: Wide crop — 16:9 or 3:2. This is the dominant element of the block.
        - name: imageAlt
          label: Photo description
          widget: string
          required: false
          hint: Read aloud by screen readers and used by search engines.
        - name: card
          label: One line for the homepage tile
          widget: text
        - name: summary
          label: Positioning sentence for the Studio page
          widget: text
        - name: capabilities
          label: Key capabilities
          widget: list
          field:
            name: item
            label: Capability
            widget: string
          hint: Three to five. They appear as the bulleted list.
        - name: price
          label: Price
          widget: string
          required: false
          hint: Leave blank until the rate is confirmed. Blank means nothing is shown.
        - name: booking
          label: Booking key
          widget: string
          hint: Matches a key under Booking → SimplyBook, e.g. podcastRoom
        - name: detail
          label: Detailed room copy
          widget: text
          required: false
          hint: >-
            The longer description shown on the Studio page under the room.
            Leave blank to use the positioning sentence alone.
        - name: focalDesktop
          label: Desktop focal point
          widget: string
          required: false
          hint: >-
            Where the desktop crop centres, as "across down". Blank is the
            middle. The mobile focal point below is separate.
        - name: startingPrice
          label: Starting price
          widget: string
          required: false
          hint: >-
            Shown as a From price. Must match SimplyBook. Blank shows nothing.
        - name: promoPrice
          label: Promotional price
          widget: string
          required: false
        - name: showPrice
          label: Show the price on the site
          widget: boolean
          default: false
          hint: Off keeps the price internal even when it is filled in.
        - name: categoryId
          label: SimplyBook category ID
          widget: string
          required: false
        - name: active
          label: Show this room
          widget: boolean
          default: true
          hint: Off hides the room from the homepage and the Studio page.
        - name: gallery
          label: Photo gallery
          widget: list
          required: false
          label_singular: Gallery photo
          summary: '{{fields.alt}}'
          hint: >-
            Three or more extra views of this room. The room photo above is
            always the first image, so adding three here gives a gallery of
            four. The VIEW PHOTOS button appears by itself once there is at
            least one photo in this list, and stays hidden while it is empty.
          fields:
          - name: image
            label: Photo
            widget: image
          - name: alt
            label: Photo description
            widget: string
            required: false
            hint: What the photo shows, e.g. Guest-facing angle with microphones.
        - name: focal
          label: Mobile focal point
          widget: string
          required: false
          default: 50% 50%
          hint: >-
            Where the phone crop centres, as "across down". 50% 50% is the
            middle. Lower the second number to pull the crop up toward faces
            and equipment, e.g. 50% 38%. Leave blank for the middle.
        - name: anchor
          label: Link anchor
          widget: string
          required: false
          hint: Used by the homepage tiles, e.g. klip-room. Change only with care.
      - name: imageAlt
        label: Photo description
        widget: string
        required: false
        hint: Read aloud by screen readers and used by search engines.
      - name: cta
        label: Main button
        widget: object
        collapsed: true
        fields:
        - name: label
          label: Button text
          widget: string
        - name: href
          label: Link
          widget: string
          required: false
        - name: booking
          label: Or open booking for
          widget: string
          required: false
        - name: consult
          label: Or open the consultation scheduler
          widget: boolean
          required: false
          default: false
        - name: photographers
          label: Or open the photographer list
          widget: boolean
          required: false
          default: false
      - name: tourCta
        label: Studio tour button
        widget: object
        collapsed: true
        fields:
        - name: label
          label: Button text
          widget: string
        - name: href
          label: Link
          widget: string
          required: false
        - name: booking
          label: Or open booking for
          widget: string
          required: false
        - name: consult
          label: Or open the consultation scheduler
          widget: boolean
          required: false
          default: false
        - name: photographers
          label: Or open the photographer list
          widget: boolean
          required: false
          default: false
      - name: featuresCta
        label: Button under the included list
        widget: object
        collapsed: true
        fields:
        - name: label
          label: Button text
          widget: string
        - name: href
          label: Link
          widget: string
          required: false
        - name: booking
          label: Or open booking for
          widget: string
          required: false
        - name: consult
          label: Or open the consultation scheduler
          widget: boolean
          required: false
          default: false
        - name: photographers
          label: Or open the photographer list
          widget: boolean
          required: false
          default: false
      - name: features
        label: Included with every booking
        widget: list
        fields:
        - name: icon
          label: Icon
          widget: string
        - name: label
          label: Text
          widget: string
      hint: Edited once here and used twice — the four tiles on the homepage and the large blocks on the Studio page.
- name: photography
  label: Photographers
  files:
  - name: photographers
    label: Photographers
    file: data/photographers.json
    fields:
    - name: photographers
      label: Photographers
      widget: object
      fields:
      - name: title
        label: Panel title
        widget: string
