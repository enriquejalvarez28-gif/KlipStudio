# ============================================================
# KLIP — site editor configuration (Sveltia CMS)
#
# Connected to  github.com/enriquejalvarez28-gif/KlipStudio  (branch: main).
# Anyone with write access to that repository can sign in at /admin
# with GitHub and edit the site. To let a teammate edit, add them as
# a collaborator on the repository — nothing here changes.
#
# Each screen below writes to its own file in /data, so saving one
# screen can never disturb another. Nobody needs to open HTML, CSS
# or JavaScript to change the site.
# ============================================================

backend:
  name: github
  repo: enriquejalvarez28-gif/KlipStudio
  branch: main
  commit_messages:
    update: 'Site edit: {{collection}} “{{slug}}”'
media_folder: img
public_folder: img
