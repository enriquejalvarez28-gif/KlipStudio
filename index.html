</head>
<body class="js-motion" data-page="home">
<main>
  <section class="hero" id="top"></section>
  <section class="sec sec--paper" id="services"></section>
  <section class="sec sec--paper" id="why" style="padding-top:0"></section>
  <section class="sec sec--paper" id="visibility" style="padding-top:0"></section>
  <section class="sec sec--dark" id="work"></section>
  <section class="sec sec--paper" id="podcasts"></section>
  <section id="studio" style="background:var(--paper);padding-bottom:clamp(44px,5vw,78px)"></section>
  <section class="sec" id="photography" style="background:var(--paper);padding-top:clamp(30px,3vw,46px)"></section>
  <section class="location" id="on-location"></section>
  <section class="sec sec--paper" id="industries"></section>
  <section class="sec sec--paper" id="about-klip" style="padding-top:0"></section>
  <section class="final" id="contact"></section>
</main>

<script src="js/klip-data.js"></script>
<script src="js/klip-site.js"></script>
<script>
/* Homepage sections. Shared chrome, modals and motion live in js/klip-site.js */
(window.KLIPREADY||function(f){f();})(function(){
  var D=window.KLIP, U=window.KLIPUI; if(!D||!U) return;
  var ar=U.ar, esc=U.esc, ext=U.ext, act=U.act, btn=U.btn, icon=U.icon, headline=U.headline, lines=U.lines, pic=U.pic;

  /* ---------- 02 hero + 03 proof ---------- */
  var H=D.hero;
  var small=window.matchMedia('(max-width:760px)').matches;
  var still=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var src = (small && H.videoMobile) ? H.videoMobile : H.videoMp4;
  var heroMedia = (!still && (src||H.videoWebm))
    ? '<video autoplay muted loop playsinline preload="metadata" poster="'+esc(H.videoPoster||H.image)+'">'+
        (function(){ var wb=(small&&H.videoMobileWebm)?H.videoMobileWebm:(small?'':H.videoWebm);
          return wb?'<source src="'+esc(wb)+'" type="video/webm">':''; })()+
        (src?'<source src="'+esc(src)+'" type="video/mp4">':'')+
      '</video>'
    : ''+pic(H.image,H.imageAlt,'fetchpriority="high"')+'';
  document.getElementById('top').innerHTML=
    '<div class="hero-media">'+heroMedia+'</div><div class="hero-scrim" aria-hidden="true"></div>'+
    '<div class="wrap"><div class="hero-copy">'+
      '<p class="eyebrow on-dark fade">'+esc(H.eyebrow)+'</p>'+
      '<h1>'+headline(H.headline)+'</h1>'+
      '<p class="lede fade">'+esc(H.body)+'</p>'+
      '<div class="hero-actions">'+btn(H.primaryCta,'btn--solid')+btn(H.secondaryCta,'btn--ghost')+'</div></div>'+
    '<div class="hero-proof">'+H.proof.map(function(p){ return '<span class="fade">'+esc(p)+'</span>'; }).join('')+'</div></div>'+
    '<div class="hero-aside" aria-hidden="true">'+lines(H.sideNote)+'</div>';

  /* ---------- 04 services ---------- */
  var S=D.services;
  document.getElementById('services').innerHTML='<div class="wrap">'+
    '<div class="sec-head rv"><div class="titles"><p class="eyebrow fade">'+esc(S.eyebrow)+'</p><h2>'+headline(S.headline)+'</h2></div>'+
    '<div class="aside"><p class="lede fade">'+esc(S.body)+'</p>'+btn(S.cta,'btn--outline')+'</div></div>'+
    '<div class="svc-grid rv">'+S.items.map(function(i){
      return '<a class="svc fade" href="'+esc(i.href)+'">'+icon(i.icon)+'<h3>'+esc(i.title)+'</h3><p>'+esc(i.text)+'</p></a>';
    }).join('')+'</div></div>';

  /* ---------- 05 why ---------- */
  var W=D.why;
  document.getElementById('why').innerHTML='<div class="wrap"><div class="why-split rv">'+
    '<div><h2>'+headline(W.headline)+'</h2><p class="lede fade" style="margin-top:20px">'+esc(W.body)+'</p></div>'+
    '<div class="why-points">'+W.points.map(function(p){
      return '<div class="why-point fade"><b>'+esc(p.title)+'</b><span>'+esc(p.text)+'</span></div>';
    }).join('')+'</div></div></div>';

  /* ---------- 06 visibility check ---------- */
  var V=D.visibility;
  document.getElementById('visibility').innerHTML='<div class="wrap"><div class="vis-panel rv">'+
    '<div class="vis-head"><div><h2 style="color:#fff">'+headline(V.headline,'?')+'</h2>'+
      '<p class="lede on-dark fade" style="margin-top:16px">'+esc(V.sub)+'</p></div>'+
      '<p class="vis-micro fade">'+esc(V.microLabel)+'</p></div>'+
    '<form class="vis-form fade" id="vis-form" novalidate>'+
      '<label class="skip" for="vis-url">Your website address</label>'+
      '<input id="vis-url" name="url" type="text" inputmode="url" autocomplete="url" placeholder="'+esc(V.placeholder)+'">'+
      '<button type="submit" id="vis-go">'+esc(V.button)+' '+ar+'</button>'+
    '</form>'+
    '<p class="vis-note fade">'+esc(V.disclaimer)+'</p>'+
    '<div class="vis-out" id="vis-out" aria-live="polite"></div>'+
  '</div></div>';

  /* ---------- 07 selected work ---------- */
  var K=D.work;
  document.getElementById('work').innerHTML='<div class="wrap">'+
    '<div class="sec-head rv"><div class="titles"><p class="eyebrow on-dark fade">'+esc(K.eyebrow)+'</p><h2>'+headline(K.headline)+'</h2></div>'+
    '<div class="aside right">'+btn(K.cta,'btn--ghost')+'</div></div>'+
    '<div class="work-grid rv">'+K.items.map(function(w){
      var cls='w fade'+(w.size==='wide'?' w-wide':'')+(w.size==='tall'?' w-tall':'')+(w.size==='span2'?' w-span2':'');
      return '<a class="'+cls+'" href="'+esc(w.href)+'">'+
        pic(w.image, w.title, 'loading="lazy" decoding="async"')+
        '<span class="w-cap"><em>'+esc(w.category)+'</em><h3>'+esc(w.title)+'</h3>'+
        '<span class="go">View Project '+ar+'</span></span></a>';
    }).join('')+'</div></div>';

  /* ---------- 08 podcasts ---------- */
  var P=D.podcasts;
  document.getElementById('podcasts').innerHTML='<div class="wrap">'+
    '<div class="sec-head rv"><div class="titles"><p class="eyebrow fade">'+esc(P.eyebrow)+'</p><h2>'+headline(P.headline)+'</h2></div>'+
    '<div class="aside right"><div style="display:flex;align-items:center;gap:26px" class="fade">'+
      '<a class="link" href="'+esc(P.cta.href)+'">'+esc(P.cta.label)+' '+ar+'</a>'+
      '<div class="carousel-ctl">'+
        '<button class="circ" data-dir="-1" aria-label="Previous clips"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>'+
        '<button class="circ" data-dir="1" aria-label="Next clips"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>'+
      '</div></div></div></div>'+
    '<div class="pod-grid rv" id="pod-grid">'+P.items.map(function(c){
      return '<a class="pod fade" href="'+esc(c.video||P.cta.href)+'"'+(c.video?' data-video="'+esc(c.video)+'"':'')+'>'+
        '<div class="pod-thumb">'+pic(c.image,c.show+': '+c.title,'loading="lazy" decoding="async"')+'</div>'+
        '<div class="pod-meta"><div><span class="label">'+esc(c.show)+'</span><h3>'+esc(c.title)+'</h3></div>'+
        '<span class="pod-time">'+esc(c.time)+'</span></div></a>';
    }).join('')+'</div></div>';

  /* ---------- 09 studio ---------- */
  var T=D.studio;
  document.getElementById('studio').innerHTML=
    '<div class="studio-split rv"><figure>'+pic(T.image,T.imageAlt,'loading="lazy" decoding="async"')+'</figure>'+
    '<div class="studio-copy"><p class="eyebrow fade">'+esc(T.eyebrow)+'</p><h2>'+headline(T.headline)+'</h2>'+
    '<p class="lede fade">'+esc(T.body)+'</p>'+
    '<div class="photo-actions">'+btn(T.cta,'btn--dark')+btn(T.tourCta,'btn--outline')+'</div></div></div>'+
    '<div class="wrap"><div class="rooms rv">'+T.rooms.map(function(r){
      var ra=act(r);
      return '<a class="room fade" href="'+esc(ra.href)+'"'+ra.attr+'><div class="room-img">'+pic(r.image,r.name,'loading="lazy" decoding="async"')+'</div>'+
      '<h3>'+esc(r.name)+'</h3><span>'+esc(r.card||r.use||'')+(r.price?'<br>'+esc(r.price):'')+'</span></a>';
    }).join('')+
    '<div class="room-panel fade"><ul>'+T.features.map(function(f){ return '<li>'+icon(f.icon)+' '+esc(f.label)+'</li>'; }).join('')+'</ul>'+
    btn(T.featuresCta,'btn--ghost')+'</div></div></div>';

  /* ---------- 10 photography ---------- */
  var F=D.photography;
  document.getElementById('photography').innerHTML='<div class="wrap"><div class="photo-split rv">'+
    '<div><p class="eyebrow fade">'+esc(F.eyebrow)+'</p><h2>'+headline(F.headline)+'</h2>'+
    '<p class="lede fade" style="margin-top:18px">'+esc(F.body)+'</p>'+
    '<div class="photo-actions">'+btn(F.primaryCta,'btn--dark')+btn(F.secondaryCta,'btn--outline')+'</div>'+
    '<p class="fade" style="margin:20px 0 0"><a class="link" href="#photography" data-photographers="1">'+esc(F.smallLink.label)+' '+ar+'</a></p></div>'+
    '<div class="photo-grid">'+F.items.map(function(p){
      return '<figure class="ph fade">'+pic(p.image,p.alt,'loading="lazy" decoding="async"')+'<figcaption>'+esc(p.label)+'</figcaption></figure>';
    }).join('')+'</div></div></div>';

  /* ---------- 11 on location ---------- */
  var L=D.location;
  document.getElementById('on-location').innerHTML=
    '<div class="bg">'+pic(L.image,L.imageAlt,'loading="lazy" decoding="async"')+'</div><div class="scrim" aria-hidden="true"></div>'+
    '<div class="wrap"><div class="loc-copy rv"><h2>'+headline(L.headline)+'</h2>'+
    '<p class="lede on-dark fade" style="margin-top:20px">'+esc(L.body)+'</p>'+btn(L.cta,'btn--ghost')+'</div>'+
    '<div class="loc-panel rv">'+L.categories.map(function(c){ return '<div class="fade">'+esc(c)+'</div>'; }).join('')+'</div></div>';

  /* ---------- 12 industries ---------- */
  var I=D.industries;
  document.getElementById('industries').innerHTML='<div class="wrap">'+
    '<div class="sec-head rv"><div class="titles"><h2>'+headline(I.headline)+'</h2></div>'+
    '<div class="aside"><p class="lede fade">'+esc(I.body)+'</p></div></div>'+
    '<div class="ind-grid rv">'+I.items.map(function(t){
      return '<a class="ind fade" href="'+esc(t.href)+'">'+pic(t.image,t.title,'loading="lazy" decoding="async"')+''+
      '<figcaption><b>'+esc(t.title)+'</b><span>'+esc(t.examples)+'</span></figcaption></a>';
    }).join('')+'</div></div>';

  /* ---------- 13 about ---------- */
  var A=D.about;
  document.getElementById('about-klip').innerHTML='<div class="wrap"><div class="about-split rv">'+
    '<figure>'+pic(A.image,A.imageAlt,'loading="lazy" decoding="async"')+'</figure>'+
    '<div><h2>'+headline(A.headline)+'</h2><p class="lede fade" style="margin-top:20px">'+esc(A.body)+'</p>'+
    '<div style="margin-top:28px">'+btn(A.cta,'btn--dark')+'</div></div></div></div>';

  /* ---------- 14 final CTA ---------- */
  var C=D.finalCta;
  document.getElementById('contact').innerHTML=
    '<div class="bg">'+pic(C.image,C.imageAlt,'loading="lazy" decoding="async"')+'</div><div class="scrim" aria-hidden="true"></div>'+
    '<div class="wrap rv"><p class="eyebrow on-dark fade">'+esc(C.eyebrow)+'</p>'+
    '<h2>'+headline([C.headline])+'</h2>'+
    '<div class="final-actions">'+btn(C.primaryCta,'btn--solid')+btn(C.secondaryCta,'btn--ghost')+'</div></div>';

  U.start();
});
</script>
</body>
</html>
